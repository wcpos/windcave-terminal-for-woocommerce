name: Test

on:
  pull_request:
  push:
    branches: [next]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    defaults:
      run:
        working-directory: 95-wc-1.0
    steps:
      - name: Checkout extension
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: 95-wc-1.0
          persist-credentials: false

      - name: Read-only Pro token
        id: pro-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WCPOS_MINI_APP_ID }}
          private-key: ${{ secrets.WCPOS_MINI_APP_PRIVATE_KEY }}
          owner: wcpos
          repositories: woocommerce-pos-pro
          permission-contents: read

      - name: Checkout Pro next as sibling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: wcpos/woocommerce-pos-pro
          ref: next
          path: woocommerce-pos-pro
          token: ${{ steps.pro-token.outputs.token }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress
          composer install --working-dir=../woocommerce-pos-pro --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'

      - name: Start WordPress test environment
        run: |
          npm i -g @wordpress/env
          printf '{"phpVersion":"%s"}\n' '${{ matrix.php }}' > .wp-env.override.json
          wp-env start

      - name: Lint PHP
        run: |
          set -euo pipefail
          find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: No case-colliding paths
        run: test -z "$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)"

      - name: Conformance and unit tests
        run: wp-env run --env-cwd='wp-content/plugins/95-wc-1.0' tests-cli -- vendor/bin/phpunit -c phpunit.xml.dist --filter "Tests\\\\"
